# Allow web-frontend to access order-processor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-processor-ingress
spec:
  podSelector:
    matchLabels:
      app: order-processor

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-frontend
      ports:
        - protocol: TCP
          port: 8080

---
# Allow order-processor to access payment-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: payment-gateway

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-processor
      ports:
        - protocol: TCP
          port: 8080
