apiVersion: v1
kind: Secret
metadata:
  name: mock-external-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_PASSWORD: "AssessmentOnly-ChangeMe"

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mock-secret-store
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: default
