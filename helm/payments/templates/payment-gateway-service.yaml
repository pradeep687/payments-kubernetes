apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  labels:
    {{- include "payments.labels" . | nindent 4 }}
spec:
  type: {{ .Values.paymentGateway.service.type }}
  selector:
    app: payment-gateway
  ports:
    - name: http
      port: {{ .Values.paymentGateway.service.port }}
      targetPort: {{ .Values.paymentGateway.service.targetPort }}
      protocol: TCP
